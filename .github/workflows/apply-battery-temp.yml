name: Apply Marvin battery temperature patch

on:
  push:
    paths:
      - .github/workflows/apply-battery-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch battery temperature display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('src/00-core.js'), Path('dist/marvin-night-city-card.js')]

          old_css = '.micro{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}'
          new_css = '.micro{display:grid;grid-template-columns:1.35fr .75fr .7fr .9fr;gap:4px}'

          old_html = '<div class="micro"><div><small>TODAY</small><b id="today">—</b></div><div><small>EV</small><b id="ev">—</b></div><div><small>BMS</small><b id="bms">—</b></div></div>'
          new_html = '<div class="micro"><div><small>TODAY</small><b id="today">—</b></div><div><small>EV</small><b id="ev">—</b></div><div><small>BMS</small><b id="bms">—</b></div><div><small>TEMP</small><b id="btemp">—</b></div></div>'

          old_bms = "const bw=this._n('sensor.growatt_battery_bms_warning'),be=this._n('sensor.growatt_battery_bms_error'),bs=this._n('sensor.growatt_battery_bms_status');this._txt('#bms',bw===null&&be===null&&bs===null?'—':((bw??0)!==0||(be??0)!==0)?'ALERT':'OK');"
          new_bms = old_bms + "const bt=this._s(this.config?.battery_temp_entity||'sensor.growatt_battery_battery_temperature')||this._s('sensor.growatt_battery_battery_temp'),btr=Number(bt?.state),btu=String(bt?.attributes?.unit_of_measurement||'').toLowerCase(),btf=Number.isFinite(btr)?(btu.includes('f')?btr:btr*9/5+32):null;let bth=null;if(btf!==null){if(btf<=32)bth=210;else if(btf<50)bth=210-(btf-32)*(25/18);else if(btf<86)bth=185-(btf-50)*(65/36);else if(btf<95)bth=120-(btf-86)*(60/9);else if(btf<104)bth=60-(btf-95)*(30/9);else if(btf<113)bth=30-(btf-104)*(30/9);else bth=0;}const btc=bth===null?'#7c8aa5':`hsl(${Math.round(bth)} 100% 62%)`,bte=NC('#btemp',this.shadowRoot);this._txt('#btemp',btf===null?'—':Math.round(btf)+'°F');if(bte){bte.style.color=btc;bte.style.textShadow=btf===null?'none':`0 0 7px ${btc}`;if(bte.parentElement)bte.parentElement.style.borderTopColor=btf===null?'rgba(115,169,194,.16)':btc;}"

          for path in files:
              text = path.read_text()
              for old, new, label in [(old_css, new_css, 'CSS'), (old_html, new_html, 'HTML'), (old_bms, new_bms, 'update logic')]:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {label} match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
              print(f'patched {path}')
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check src/00-core.js
          node --check dist/marvin-night-city-card.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/00-core.js dist/marvin-night-city-card.js
          git commit -m "Add battery temperature to Marvin Home"
          git push origin HEAD:main
